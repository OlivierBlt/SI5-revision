<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Révisions SI5</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231A1A1F'/%3E%3Cpath d='M10 23V9h6.5a4.5 4.5 0 0 1 0 9H10m6.5 0L22 23' stroke='%23F6F5F2' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="site/style.css">
<script>
  /* Applique le thème avant le rendu pour éviter un flash */
  try { var t = JSON.parse(localStorage.getItem("revision-site-v1") || "{}").theme;
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
</head>
<body>
<div class="shell" id="shell">

  <!-- Barre mobile -->
  <header class="mobilebar">
    <button class="iconbtn" id="openNav" aria-label="Ouvrir le menu">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <a class="brand brand--small" href="#/"><span class="brand__mark">R</span><span>Révisions SI5</span></a>
    <button class="iconbtn" data-action="search" aria-label="Rechercher">
      <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="2" fill="none"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </header>

  <!-- Barre latérale -->
  <aside class="sidebar" id="sidebar" aria-label="Navigation">
    <a class="brand" href="#/">
      <span class="brand__mark">R</span>
      <span class="brand__text"><strong>Révisions</strong><small>Polytech · SI5</small></span>
    </a>

    <button class="searchbtn" data-action="search">
      <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="2" fill="none"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Rechercher</span>
      <kbd>Ctrl K</kbd>
    </button>

    <nav class="nav">
      <a class="nav__item" href="#/" data-nav="home">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/></svg>
        <span>Tableau de bord</span>
      </a>
      <p class="nav__label">Matières</p>
      <div id="navMatieres"></div>
    </nav>

    <div class="sidebar__foot">
      <p class="nav__label">Apparence</p>
      <div class="seg" role="radiogroup" aria-label="Thème" id="themeSeg">
        <button role="radio" data-theme-set="auto">Auto</button>
        <button role="radio" data-theme-set="light">Clair</button>
        <button role="radio" data-theme-set="dark">Sombre</button>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- Contenu -->
  <main class="main" id="main" tabindex="-1"></main>
</div>

<!-- Palette de recherche -->
<div class="palette" id="palette" hidden>
  <div class="palette__box" role="dialog" aria-label="Recherche">
    <div class="palette__input">
      <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="2" fill="none"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="paletteInput" type="text" placeholder="Une matière, un QCM, un chapitre…" autocomplete="off" spellcheck="false">
      <kbd>Échap</kbd>
    </div>
    <ul class="palette__list" id="paletteList" role="listbox"></ul>
  </div>
</div>

<script src="site/contenu.js"></script>
<script src="site/app.js"></script>
</body>
</html>
